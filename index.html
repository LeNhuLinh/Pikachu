<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="game">
    <section id="screen-start" class="screen is-active">
        <h1>Game Pikachu</h1>
        <p class="subtitle"> Chọn level để bắt đầu </p>
        <div class="button">
            <button class="btnlevel" data-value="1">Level 1</button>
            <button class="btnlevel" data-value="2">Level 2</button>
            <button class="btnlevel" data-value="3">Level 3</button>
            <button class="btnlevel" data-value="4">Level 4</button>
            <button class="btnlevel" data-value="5">Level 5</button>
            <button class="btnlevel" data-value="6">Level 6</button>
            <button class="btnlevel" data-value="7">Level 7</button>
            <button class="btnlevel" data-value="8">Level 8</button>
            <button class="btnlevel" data-value="9">Level 9</button>
            <button class="btnlevel" data-value="10">Level 10</button>
        </div>
    </section>
    <section id="screen-game" class="screen">
            <header class="infor">
                <div class="game-infor">
                    <span class="infor-label">BÀN</span>
                    <strong id="glevel" class="infor-val val-cyan">1</strong>
                </div>
                <div class="game-infor">
                    <span class="infor-label">LƯỢT ĐỔI</span>
                    <strong id="gshuffle-count" class="infor-val val-purple">3</strong>
                </div>
                <div class="game-infor">
                    <span class="infor-label">ĐIỂM</span>
                    <strong id="gscore" class="infor-val val-yellow">0</strong>
                </div>
            </header>
            <div class="time">
                <div class="bar" id="timer-bar"></div>
            </div>
        <div class="wrap">
            <div id="board" style="--cols:17; --rows:10">

            </div>
            <svg id="connector" class="connector" viewBox="0 0 17 10" preserveAspectRatio="none"></svg>
        </div>
        <div class="btnplay">
            <button class="btn-gameplay" id="hint">Gợi ý</button>
            <button class="btn-gameplay" id="shuffle">Trộn</button>
            <button class="btn-gameplay" id="new">Ván mới</button>
            <button class="btn-gameplay" id="exit">Thoát</button>
        </div>
    </section>
    <section id="screen-end" class="screen">
        <h2 id="end-message">Game Over</h2>
        <p>Điểm <strong id="end-score"></strong> </p>
        <div class="button-end">
            <button class="btnEnd" id="newGame" value="1">Bắt đầu lại</button>
            <button class="btnEnd" id="menuGame" value="2">Menu</button>
        </div>
    </section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
